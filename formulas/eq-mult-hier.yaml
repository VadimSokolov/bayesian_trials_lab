id: eq-mult-hier
section: 10/the-idea
title: Hierarchical model for several effects
tex: |-
  \htmlClass{term c1}{\hat\theta_j \mid \theta_j \sim N(\theta_j, s_j^2)}, \qquad \htmlClass{term c2}{\theta_j \mid \mu, \tau_g \sim N(\mu, \tau_g^2)},
parts:
  - {k: c1, words: "Each observed effect scatters around its true effect by its own standard error"}
  - ", and "
  - {k: c2, words: "the true effects themselves are draws around a common mean with a between-group spread"}
  - "."
notes:
  c1: "$\\hat\\theta_j$ is the observed effect (for example a log odds ratio) and $s_j$ its standard error."
  c2: "$\\mu$ is the common mean and $\\tau_g$ the between-group standard deviation; this lets related results inform one another."
