id: eq-sequential-bellman
section: 11/the-bayes-sequential-decision-problem
title: Bayes sequential decision recursion
tex: |-
  \htmlClass{term c1}{V(n,S)} = \min\Bigl\{\htmlClass{term c2}{\min_d \mathbb{E}[\ell(\theta,d) \mid n, S]},\;\; \htmlClass{term c3}{\mathbb{E}[\kappa(\theta) \mid n, S]} + \htmlClass{term c4}{\mathbb{E}_{\text{pred}}\bigl[V(n+1, S+X_{n+1})\bigr]}\Bigr\},
parts:
  - {k: c1, words: "The minimal expected future loss in the current state"}
  - " is the smaller of two options: "
  - {k: c2, words: "stop now and take the best terminal decision"}
  - ", or pay "
  - {k: c3, words: "the expected cost of one more observation"}
  - " plus "
  - {k: c4, words: "the expected value of the best continuation from the next state"}
  - "."
notes:
  c1: "State is the sample size $n$ and sufficient statistic $S$."
  c2: "Posterior expected terminal loss, minimized over decisions $d$."
  c3: "Sampling cost."
  c4: "Averaged over the predictive distribution of the next observation; filled by backward induction."
