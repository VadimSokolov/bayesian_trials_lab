id: eq-predictive
section: sec-predictive-dist
title: "Posterior predictive distribution"
tex: "\\htmlClass{term c1}{p(\\tilde y \\mid y)} = \\htmlClass{term c2}{\\int p(\\tilde y \\mid \\theta)}\\, \\htmlClass{term c3}{\\pi(\\theta \\mid y)}\\, d\\theta ."
parts:
  - "The "
  - {k: c1, words: "distribution of future data given the data so far"}
  - " is "
  - {k: c2, words: "the distribution of future data at each possible parameter value"}
  - " averaged with weights from "
  - {k: c3, words: "the posterior of the parameter"}
  - "."
notes:
  c1: "What will happen next, such as how many of the next 50 patients respond."
  c2: "Prediction as if the parameter were known."
  c3: "Averaging over the uncertainty about the parameter makes the prediction wider than a plug-in calculation."
