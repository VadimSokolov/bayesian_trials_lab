id: eq-pp
section: 15/from-conditional-power-to-predictive-probability
title: Predictive probability of success
tex: \htmlClass{term c1}{\mathrm{PP}} = \int \htmlClass{term c2}{\mathrm{CP}(\xi)}\, \htmlClass{term c3}{\pi(\xi \mid y_{1:n})}\, d\xi = \htmlClass{term c4}{\Pr(\text{final success criterion met} \mid y_{1:n})},
parts:
- 'The '
- k: c1
  words: predictive probability of success
- ' is '
- k: c2
  words: the conditional power at each possible drift
- ', averaged with weights from '
- k: c3
  words: the posterior of the drift given the interim data
- '. That is '
- k: c4
  words: the chance the final success criterion is met, given the data so far
- .
notes:
  c1: Conditional power averaged over what has been learned about the effect.
  c2: Conditional power for a fixed $\xi$.
  c3: The posterior at the interim; it replaces the single fixed value of $\xi$.
  c4: 'The second equality is the definition: probability over the posterior predictive distribution of the data still to come.'
